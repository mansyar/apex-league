<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex League</title>
    <meta
      name="description"
      content="Raise a voxel partner, keep the ranch thriving, and climb the Apex League — a cozy creature-raising game in your browser."
    />
    <meta name="theme-color" content="#241c10" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23241c10'/%3E%3Crect x='4' y='6' width='3' height='3' fill='%23ffd166'/%3E%3Crect x='9' y='6' width='3' height='3' fill='%23ffd166'/%3E%3Crect x='4' y='11' width='8' height='2' fill='%23ffd166'/%3E%3C/svg%3E"
    />
    <meta property="og:title" content="Apex League" />
    <meta
      property="og:description"
      content="Raise a voxel partner, keep the ranch thriving, and climb the Apex League — a cozy creature-raising game in your browser."
    />
    <meta property="og:type" content="website" />
    <style>
      /* Boot placeholder + no-JS notice (F7). Styled inline because the kit
         stylesheet arrives with the module; kept visually identical to the
         failure plate so a failure never flashes a blank page. */
      #boot-plate,
      #noscript-plate {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: #14100c;
        color: #f4ecdf;
        text-align: center;
        font-family: system-ui, sans-serif;
      }
      #boot-plate p,
      #noscript-plate p {
        margin: 0;
      }
      .boot-title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .boot-sub {
        font-size: 12px;
        color: #b8ad9c;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-plate" role="status">
        <p class="boot-title">Apex League</p>
        <p class="boot-sub">Warming up the ranch…</p>
      </div>
    </div>
    <noscript>
      <div id="noscript-plate" role="alert">
        <p class="boot-title">JavaScript is off</p>
        <p class="boot-sub">
          The ranch needs JavaScript to run. Enable it and reload.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
