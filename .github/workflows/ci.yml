# CI gate for pull requests — mirrors the local pre-commit gate exactly.
# `bun run verify` = workspace type checks + typed bun test + Biome + the
# voxel determinism gate (generated GLBs must be byte-identical).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (types, tests, biome, voxel determinism)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the stable Bun that produced the first green CI run
          # (2026-10-10). Local dev is currently a canary; bump the pin when
          # CI should ride a new stable.
          bun-version: 1.4.2

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verify gate
        run: bun run verify
