# CI gate for pull requests — mirrors the local pre-commit gate exactly.
# `bun run verify` = workspace type checks + typed bun test + Biome + the
# voxel determinism gate (generated GLBs must be byte-identical).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (types, tests, biome, voxel determinism)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the stable Bun that runs `bun check`, the type checker the
          # three `check` scripts call. That command landed in 1.4.3; on 1.4.2 it
          # does not exist, and 1.4.2 exits 0 anyway after printing the spawn
          # error, so the typecheck layer silently passed without checking
          # anything. Keep this in lockstep with deploy.yml and nightly.yml.
          bun-version: 1.4.4

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verify gate
        run: bun run verify
