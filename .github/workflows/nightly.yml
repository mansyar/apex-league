# Nightly drift check on main: re-run the voxel determinism gate so any
# nondeterminism or accidental generated-GLB mutation surfaces the next
# morning, not inside a future track's PR.
name: Nightly determinism

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-determinism-${{ github.ref }}
  cancel-in-progress: false

jobs:
  determinism:
    name: Determinism gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Kept in lockstep with the CI workflow's pin.
          bun-version: 1.4.2

      - name: Restore Bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Determinism gate
        run: bun run gate:determinism
